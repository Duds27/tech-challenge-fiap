name: CD

# Deploy automático das branches de homologação e produção.
on:
  push:
    branches: [homolog, prod]
  workflow_dispatch:

permissions:
  id-token: write # OIDC para assumir a role AWS
  contents: read

jobs:
  deploy:
    name: Build + Deploy da Lambda (Terraform)
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      TF_ENV: ${{ github.ref_name }} # homolog | prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Empacotar Lambda (zip)
        run: |
          cd dist && zip -r ../dist/lambda.zip handler.js authorizer.js *.map

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lambda-auth/${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="environment=${TF_ENV}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="jwt_secret_id=${{ secrets.JWT_SECRET_ID }}"
