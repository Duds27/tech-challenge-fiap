services:
  # ── SonarQube Community Edition ──────────────────────────────
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 120s

  # ── OWASP ZAP — Baseline Scan ────────────────────────────────
  # Uso: docker compose -f docker-compose.security.yml --profile zap up
  # A API deve estar rodando em http://localhost:8080 antes de iniciar o ZAP
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap-scanner
    command: >
      zap-baseline.py
      -t http://host.docker.internal:8080
      -r /zap/wrk/zap-baseline-report.html
      -J /zap/wrk/zap-baseline-report.json
      -x /zap/wrk/zap-baseline-report.xml
      -I
    volumes:
      - ./reports:/zap/wrk:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - zap

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
