# ============================================================
# SonarQube Scanner — OficinaMecanicaBackend
# ============================================================
sonar.projectKey=oficina-mecanica-backend
sonar.projectName=Oficina Mecanica Backend
sonar.projectVersion=1.0.0

# Diretórios de código-fonte e testes
sonar.sources=src/OficinaMecanicaBackend
sonar.tests=tests/OficinaMecanicaBackend.Tests

# Encoding
sonar.sourceEncoding=UTF-8

# Relatório de cobertura gerado pelo coverlet (formato OpenCover)
sonar.cs.opencover.reportsPaths=tests/OficinaMecanicaBackend.Tests/**/coverage.opencover.xml

# Exclusões de análise
sonar.exclusions=**/Migrations/**,**/obj/**,**/bin/**,**/*.Designer.cs
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/Data/AppDbContext.cs

# Quality Gate — falha se vulnerabilidade crítica encontrada
sonar.qualitygate.wait=true
