services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=OficinaMecanica;User=root;Password=Your_password123;
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Your_password123
      MYSQL_DATABASE: OficinaMecanica
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Força ping via TCP (não socket). Durante a inicialização, o MySQL sobe um
      # servidor temporário só-socket; ping por TCP só passa quando o servidor real
      # aceita conexões — evitando marcar o container como saudável cedo demais.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "--protocol=tcp", "-uroot", "-pYour_password123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
