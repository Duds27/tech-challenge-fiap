apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
# ATENÇÃO: valores de EXEMPLO para desenvolvimento local. Em ambientes reais,
# NÃO versione segredos — aplique-os fora do git (kubectl create secret,
# Sealed Secrets, External Secrets, SOPS, etc.). Usa-se stringData por
# legibilidade (o Kubernetes codifica em base64 automaticamente).
stringData:
  # Connection string completa (contém a senha) — consumida pela API.
  ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=OficinaMecanica;User=root;Password=Your_password123;"
  # Chave de assinatura JWT (mínimo 32 caracteres).
  Jwt__Key: "OficinaMecanicaSecretKeyMustBe32CharactersMin!"
  Jwt__AdminPassword: "Admin@123"
  # Senha do root do MySQL (usada pelo StatefulSet do banco).
  MYSQL_ROOT_PASSWORD: "Your_password123"
