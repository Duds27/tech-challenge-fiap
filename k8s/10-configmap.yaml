apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
data:
  # Configuração NÃO sensível da API (lida via variáveis de ambiente).
  # O padrão hierárquico do .NET usa "__" para aninhar chaves (Jwt:Issuer -> Jwt__Issuer).
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__Issuer: "OficinaMecanicaBackend"
  Jwt__Audience: "OficinaMecanicaBackend"
  Jwt__AdminUsername: "admin"
  Jwt__ExpiresInMinutes: "60"
  # Configuração do banco (host = nome do Service do MySQL)
  MYSQL_DATABASE: "OficinaMecanica"
